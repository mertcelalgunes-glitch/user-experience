<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart | EduMart</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
</head>
<body class="bg-gray-50">
    <custom-navbar></custom-navbar>
    
    <main class="container mx-auto px-6 py-24">
        <h1 class="text-4xl font-bold mb-12">Your Shopping Cart</h1>
        
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Cart Items -->
            <div class="lg:col-span-2">
                <div id="cart-items" class="space-y-6">
                    <!-- Cart items will be dynamically inserted here -->
                </div>
                
                <div id="empty-cart-message" class="text-center py-12 hidden">
                    <i data-feather="shopping-cart" class="w-16 h-16 mx-auto text-gray-300 mb-4"></i>
                    <h3 class="text-xl font-bold mb-2">Your cart is empty</h3>
                    <p class="text-gray-600 mb-6">Browse our products to add items to your cart</p>
                    <a href="/products.html" class="inline-block bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-3 rounded-lg transition duration-300">Shop Now</a>
                </div>
            </div>
            
            <!-- Order Summary -->
            <div>
                <div class="bg-white rounded-xl p-6 shadow-lg sticky top-24">
                    <h2 class="text-xl font-bold mb-6">Order Summary</h2>
                    
                    <div class="space-y-4 mb-6">
                        <div class="flex justify-between">
                            <span class="text-gray-600">Subtotal</span>
                            <span id="subtotal" class="font-medium">$0.00</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-gray-600">Shipping</span>
                            <span class="font-medium text-green-600">FREE</span>
                        </div>
                        <div class="border-t border-gray-200 pt-4 flex justify-between">
                            <span class="font-bold">Total</span>
                            <span id="total" class="font-bold text-lg">$0.00</span>
                        </div>
                    </div>
                    
                    <a href="/checkout.html" id="checkout-btn" class="block w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg text-center transition duration-300 disabled:bg-gray-400 disabled:cursor-not-allowed" disabled>
                        Proceed to Checkout
                    </a>
                    
                    <div class="mt-4 flex items-center text-sm text-gray-500">
                        <i data-feather="lock" class="w-4 h-4 mr-2"></i>
                        <span>Secure checkout</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <custom-footer></custom-footer>

    <script src="components/navbar.js"></script>
    <script src="components/footer.js"></script>
    <script src="script.js"></script>
    <script>
        feather.replace();
        
        function renderCart() {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            const cartItemsContainer = document.getElementById('cart-items');
            const emptyCartMessage = document.getElementById('empty-cart-message');
            const subtotalElement = document.getElementById('subtotal');
            const totalElement = document.getElementById('total');
            const checkoutBtn = document.getElementById('checkout-btn');
            
            if (cart.length === 0) {
                cartItemsContainer.innerHTML = '';
                emptyCartMessage.classList.remove('hidden');
                subtotalElement.textContent = '$0.00';
                totalElement.textContent = '$0.00';
                checkoutBtn.setAttribute('disabled', '');
                return;
            }
            
            emptyCartMessage.classList.add('hidden');
            
            let subtotal = 0;
            cartItemsContainer.innerHTML = cart.map(item => {
                const itemTotal = item.price * item.quantity;
                subtotal += itemTotal;
                
                return `
                    <div class="flex flex-col sm:flex-row gap-6 bg-white rounded-xl p-6 shadow-md">
                        <div class="flex-shrink-0 w-full sm:w-32 h-32 bg-gray-100 rounded-lg overflow-hidden">
                            <img src="http://static.photos/education/320x240/${Math.floor(Math.random() * 20) + 1}" alt="${item.name}" class="w-full h-full object-cover">
                        </div>
                        <div class="flex-grow">
                            <div class="flex justify-between">
                                <h3 class="text-lg font-bold">${item.name}</h3>
                                <span class="text-lg font-bold">$${item.price.toFixed(2)}</span>
                            </div>
                            <div class="flex items-center mt-8">
                                <button class="decrease-quantity px-3 py-1 border border-gray-300 rounded-l-lg" data-id="${item.id}">-</button>
                                <span class="quantity px-4 py-1 border-t border-b border-gray-300">${item.quantity}</span>
                                <button class="increase-quantity px-3 py-1 border border-gray-300 rounded-r-lg" data-id="${item.id}">+</button>
                                <button class="remove-item ml-4 text-red-500 hover:text-red-700" data-id="${item.id}">
                                    <i data-feather="trash-2" class="w-4 h-4"></i>
                                </button>
                            </div>
                            <div class="mt-4">
                                <span class="font-bold">$${itemTotal.toFixed(2)}</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
            
            subtotalElement.textContent = `$${subtotal.toFixed(2)}`;
            totalElement.textContent = `$${subtotal.toFixed(2)}`;
            checkoutBtn.removeAttribute('disabled');
            
            feather.replace();
            
            // Add event listeners
            document.querySelectorAll('.increase-quantity').forEach(btn => {
                btn.addEventListener('click', function() {
                    const productId = this.getAttribute('data-id');
                    updateQuantity(productId, 1);
                });
            });
            
            document.querySelectorAll('.decrease-quantity').forEach(btn => {
                btn.addEventListener('click', function() {
                    const productId = this.getAttribute('data-id');
                    updateQuantity(productId, -1);
                });
            });
            
            document.querySelectorAll('.remove-item').forEach(btn => {
                btn.addEventListener('click', function() {
                    const productId = this.getAttribute('data-id');
                    removeItem(productId);
                });
            });
        }
        
        function updateQuantity(productId, change) {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            const itemIndex = cart.findIndex(item => item.id === productId);
            
            if (itemIndex !== -1) {
                cart[itemIndex].quantity += change;
                
                // Remove item if quantity reaches 0
                if (cart[itemIndex].quantity <= 0) {
                    cart.splice(itemIndex, 1);
                }
                
                localStorage.setItem('cart', JSON.stringify(cart));
                renderCart();
                updateCartCount();
                
                // Show feedback
                const message = change > 0 ? 'Quantity increased' : 'Quantity decreased';
                showToast(message);
            }
        }
        
        function removeItem(productId) {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            cart = cart.filter(item => item.id !== productId);
            localStorage.setItem('cart', JSON.stringify(cart));
            
            renderCart();
            updateCartCount();
            showToast('Item removed from cart');
        }
        
        // Initialize cart
        document.addEventListener('DOMContentLoaded', function() {
            renderCart();
        });
    </script>
</body>
</html>
