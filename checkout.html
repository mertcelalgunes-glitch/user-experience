<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | EduMart</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
</head>
<body class="bg-gray-50">
    <custom-navbar></custom-navbar>
    
    <main class="container mx-auto px-6 py-24">
        <div class="max-w-6xl mx-auto">
            <!-- Checkout Progress -->
            <div class="flex justify-between mb-12">
                <div class="flex flex-col items-center">
                    <div class="w-10 h-10 rounded-full bg-blue-600 text-white flex items-center justify-center mb-2">
                        <i data-feather="shopping-cart" class="w-4 h-4"></i>
                    </div>
                    <span class="text-sm font-medium">Cart</span>
                </div>
                <div class="flex flex-col items-center">
                    <div class="w-10 h-10 rounded-full bg-blue-600 text-white flex items-center justify-center mb-2">
                        <span>2</span>
                    </div>
                    <span class="text-sm font-medium">Information</span>
                </div>
                <div class="flex flex-col items-center">
                    <div class="w-10 h-10 rounded-full bg-gray-200 text-gray-600 flex items-center justify-center mb-2">
                        <span>3</span>
                    </div>
                    <span class="text-sm font-medium">Shipping</span>
                </div>
                <div class="flex flex-col items-center">
                    <div class="w-10 h-10 rounded-full bg-gray-200 text-gray-600 flex items-center justify-center mb-2">
                        <span>4</span>
                    </div>
                    <span class="text-sm font-medium">Payment</span>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-12">
                <!-- Checkout Form -->
                <div>
                    <h2 class="text-2xl font-bold mb-6">Customer Information</h2>
                    
                    <form id="checkout-form" class="space-y-6">
                        <div>
                            <label for="email" class="block text-gray-700 font-medium mb-2">Email address</label>
                            <input type="email" id="email" required 
                                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                        </div>
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div>
                                <label for="first-name" class="block text-gray-700 font-medium mb-2">First name</label>
                                <input type="text" id="first-name" required 
                                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                            </div>
                            <div>
                                <label for="last-name" class="block text-gray-700 font-medium mb-2">Last name</label>
                                <input type="text" id="last-name" required 
                                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                            </div>
                        </div>
                        
                        <div>
                            <label for="address" class="block text-gray-700 font-medium mb-2">Address</label>
                            <input type="text" id="address" required 
                                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                        </div>
                        
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                            <div>
                                <label for="city" class="block text-gray-700 font-medium mb-2">City</label>
                                <input type="text" id="city" required 
                                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                            </div>
                            <div>
                                <label for="state" class="block text-gray-700 font-medium mb-2">State</label>
                                <select id="state" required 
                                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                                    <option value="">Select</option>
                                    <option value="AL">Alabama</option>
                                    <option value="AK">Alaska</option>
                                    <!-- More states would go here -->
                                    <option value="CA">California</option>
                                    <option value="NY">New York</option>
                                    <option value="TX">Texas</option>
                                </select>
                            </div>
                            <div>
                                <label for="zip" class="block text-gray-700 font-medium mb-2">ZIP code</label>
                                <input type="text" id="zip" required 
                                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                            </div>
                        </div>
                        
                        <div>
                            <label for="phone" class="block text-gray-700 font-medium mb-2">Phone number</label>
                            <input type="tel" id="phone" 
                                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                        </div>
                        
                        <div class="flex items-center">
                            <input type="checkbox" id="save-info" class="rounded text-blue-600 focus:ring-blue-500">
                            <label for="save-info" class="ml-2 text-gray-600">Save this information for next time</label>
                        </div>
                        
                        <div class="flex justify-between pt-6">
                            <a href="/cart.html" class="text-blue-600 hover:text-blue-800 font-medium flex items-center">
                                <i data-feather="arrow-left" class="w-4 h-4 mr-2"></i>
                                Return to cart
                            </a>
                            <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-3 rounded-lg transition duration-300">
                                Continue to shipping
                            </button>
                        </div>
                    </form>
                </div>
                
                <!-- Order Summary -->
                <div>
                    <div class="bg-white rounded-xl p-6 shadow-lg sticky top-24">
                        <h2 class="text-xl font-bold mb-6">Order Summary</h2>
                        
                        <div id="order-items" class="space-y-4 mb-6 max-h-96 overflow-y-auto">
                            <!-- Order items will be dynamically inserted here -->
                        </div>
                        
                        <div class="space-y-4 mb-6 border-t border-gray-200 pt-4">
                            <div class="flex justify-between">
                                <span class="text-gray-600">Subtotal</span>
                                <span id="subtotal" class="font-medium">$0.00</span>
                            </div>
                            <div class="flex justify-between">
                                <span class="text-gray-600">Shipping</span>
                                <span class="font-medium text-green-600">FREE</span>
                            </div>
                            <div class="flex justify-between border-t border-gray-200 pt-4">
                                <span class="font-bold">Total</span>
                                <span id="total" class="font-bold text-lg">$0.00</span>
                            </div>
                        </div>
                        
                        <div class="flex items-center text-sm text-gray-500">
                            <i data-feather="lock" class="w-4 h-4 mr-2"></i>
                            <span>Secure checkout</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <custom-footer></custom-footer>

    <script src="components/navbar.js"></script>
    <script src="components/footer.js"></script>
    <script src="script.js"></script>
    <script>
        feather.replace();
        
        // Load cart items into checkout page
        function loadOrderSummary() {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            const orderItemsContainer = document.getElementById('order-items');
            const subtotalElement = document.getElementById('subtotal');
            const totalElement = document.getElementById('total');
            
            let subtotal = 0;
            
            if (cart.length === 0) {
                orderItemsContainer.innerHTML = `
                    <div class="text-center py-8 text-gray-500">
                        <i data-feather="shopping-cart" class="w-8 h-8 mx-auto mb-2"></i>
                        <p>Your cart is empty</p>
                    </div>
                `;
                subtotalElement.textContent = '$0.00';
                totalElement.textContent = '$0.00';
                return;
            }
            
            orderItemsContainer.innerHTML = cart.map(item => {
                const itemTotal = item.price * item.quantity;
                subtotal += itemTotal;
                
                return `
                    <div class="flex justify-between items-center">
                        <div class="flex items-center">
                            <div class="w-12 h-12 rounded-md bg-gray-100 mr-4 overflow-hidden">
                                <img src="http://static.photos/education/120x90/${Math.floor(Math.random() * 20) + 1}" 
                                     alt="${item.name}" class="w-full h-full object-cover">
                            </div>
                            <div>
                                <h4 class="font-medium">${item.name}</h4>
                                <p class="text-gray-500 text-sm">Qty: ${item.quantity}</p>
                            </div>
                        </div>
                        <span class="font-medium">$${itemTotal.toFixed(2)}</span>
                    </div>
                `;
            }).join('');
            
            subtotalElement.textContent = `$${subtotal.toFixed(2)}`;
            totalElement.textContent = `$${subtotal.toFixed(2)}`;
            
            feather.replace();
        }
        
        // Form validation
        document.getElementById('checkout-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Simple validation - in a real app you'd do more thorough validation
            const email = document.getElementById('email').value;
            const firstName = document.getElementById('first-name').value;
            const lastName = document.getElementById('last-name').value;
            const address = document.getElementById('address').value;
            const city = document.getElementById('city').value;
            const state = document.getElementById('state').value;
            const zip = document.getElementById('zip').value;
            
            if (!email || !firstName || !lastName || !address || !city || !state || !zip) {
                alert('Please fill out all required fields');
                return;
            }
            
            // In a real app, you would proceed to shipping/payment
            // For demo purposes, just show a success message
            showToast('Order information saved! Redirecting to shipping...');
            
            // Simulate redirect after 2 seconds
            setTimeout(() => {
                window.location.href = '/shipping.html'; // This would be your next step
            }, 2000);
        });
        
        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            loadOrderSummary();
            updateCartCount();
        });
    </script>
</body>
</html>
